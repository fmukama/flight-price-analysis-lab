name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRFLOW_VERSION: "2.9.2"
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest

    # No MySQL/Postgres services: the suite runs on in-memory fixtures and
    # DagBag parsing only. DB-facing guarantees are verified against the real
    # stack via `make test`. No apt-get either -- nothing here compiles.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docker/airflow/requirements.txt

      # Same dependency set and constraints file as the Airflow image. Never
      # re-pin Airflow here: doing so once masked a broken requirements.txt and
      # kept CI green while the image shipped a crash-looping Airflow 3.3.1.
      # The version assertion lives in tests/ so it runs locally too.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r docker/airflow/requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Lint
        run: |
          # Blocking: syntax errors and undefined names
          flake8 dags tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advisory: style only
          flake8 dags tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test
        env:
          PYTHONPATH: .
        run: pytest tests -q
