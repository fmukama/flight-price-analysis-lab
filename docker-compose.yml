# Common configuration shared across all Airflow service blocks
x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    # Metadata database connection string for Airflow core state
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_METADATA_DB}
    # Using LocalExecutor to execute multiple tasks concurrently on the single scheduler
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Paused on creation (the Airflow default). A DAG with a past start_date
    # that is live the moment the stack boots will fire an unattended run.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # Shared signing key so webserver sessions stay valid across restarts
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-flight_price_local_dev_secret}
    # Expose the scheduler health endpoint so its healthcheck can be meaningful
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Lets `from dags.scripts... import ...` resolve inside tasks
    PYTHONPATH: /opt/airflow
  # AIRFLOW_UID belongs here, not in `environment` -- it selects the container
  # user so files written into the bind mounts match host ownership.
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    # Mount local directories into container for live sync code editing
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./tests:/opt/airflow/tests
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy
  networks:
    - flight_network

services:
  # 1. MYSQL: Staging Database (Raw CSV Ingestion)
  mysql:
    image: mysql:8.0
    container_name: flight_mysql_staging
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # MYSQL_HOST_PORT is the host-side port only. Change it freely to dodge a
      # local clash; the in-container port stays 3306, which is what MYSQL_PORT
      # tells the pipeline scripts to dial over the compose network.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_staging_data:/var/lib/mysql
      - ./sql/mysql:/docker-entrypoint-initdb.d # Runs init_staging.sql on first startup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flight_network

  # 2. POSTGRESQL: Dual Role (Analytics DB + Airflow Metadata DB)
  postgres:
    image: postgres:15
    container_name: flight_postgres_analytics
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host-side port only -- see the MySQL note above.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d # Runs init_analytics.sql on first startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flight_network

  # 3. AIRFLOW INIT: One-time database migrations & default admin user creation
  airflow-init:
    <<: *airflow-common
    container_name: flight_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Without this, a failing `airflow` command still exits 0, the
        # service_completed_successfully gate passes, and the webserver and
        # scheduler are released into a crash-loop with no signal why.
        set -euo pipefail

        echo "[init] Ensuring Airflow metadata database '${AIRFLOW_METADATA_DB}' exists..."
        if ! PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
             -tAc "SELECT 1 FROM pg_database WHERE datname = '${AIRFLOW_METADATA_DB}'" | grep -q 1; then
          PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
             -c "CREATE DATABASE ${AIRFLOW_METADATA_DB};"
          echo "[init] Created database ${AIRFLOW_METADATA_DB}."
        else
          echo "[init] Database ${AIRFLOW_METADATA_DB} already present."
        fi

        # `db migrate` is the supported command in 2.9; `db init` is deprecated.
        echo "[init] Running Airflow schema migrations..."
        airflow db migrate

        echo "[init] Ensuring admin user exists..."
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          || echo "[init] Admin user already exists, skipping."

        # Final gate: proves the metadata DB is reachable and migrated before
        # any dependent service is allowed to start.
        echo "[init] Verifying metadata database connectivity..."
        airflow db check
        echo "[init] Initialisation complete."
    restart: on-failure

  # 4. AIRFLOW WEBSERVER: Web Dashboard UI (Port 8080)
  airflow-webserver:
    <<: *airflow-common
    container_name: flight_airflow_webserver
    restart: always
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 5. AIRFLOW SCHEDULER: Continuous DAG triggers and task dispatching
  airflow-scheduler:
    <<: *airflow-common
    container_name: flight_airflow_scheduler
    restart: always
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 6. JUPYTERLAB: Exploration, Visualizations, and Prototype Data Cleaning
  jupyter:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: flight_jupyter_eda
    restart: always
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      # Consumed by the image CMD as the JupyterLab access token
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-easyeda2026}
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./dags/scripts:/app/scripts
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flight_network

  # 7. ADMINER: Lightweight SQL browser for the staging and analytics databases
  adminer:
    image: adminer:4.8.1
    container_name: flight_adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flight_network

# Persistent data volumes so database records remain intact when containers restart
volumes:
  mysql_staging_data:
  postgres_analytics_data:

# Unified bridge network allowing all containers to resolve each other by service name
networks:
  flight_network:
    driver: bridge
